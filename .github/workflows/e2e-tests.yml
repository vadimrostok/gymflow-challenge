name: End-to-End Tests

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  e2e-tests:
    name: e2e-tests
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install chromium

      - name: Install Detox simulator tools
        run: |
          brew tap wix/brew
          brew install applesimutils

      - name: Create iOS simulator
        run: |
          set -euo pipefail

          DEVICE_TYPE="$(xcrun simctl list devicetypes | awk -F '[()]' '
            /iPhone 16 Pro/ { print $2; exit }
            /iPhone 16/ { print $2; exit }
            /iPhone 15 Pro/ { print $2; exit }
            /iPhone 15/ { print $2; exit }
          ')"

          RUNTIME="$(xcrun simctl list runtimes | awk '
            /iOS/ && $0 !~ /unavailable/ {
              for (i = 1; i <= NF; i++) {
                if ($i ~ /^com\.apple\.CoreSimulator\.SimRuntime\.iOS-/) {
                  runtime = $i
                }
              }
            }
            END { print runtime }
          ')"

          if [ -z "$DEVICE_TYPE" ] || [ -z "$RUNTIME" ]; then
            xcrun simctl list devicetypes
            xcrun simctl list runtimes
            exit 1
          fi

          DEVICE_ID="$(xcrun simctl create "Gymflow Detox" "$DEVICE_TYPE" "$RUNTIME")"
          echo "DETOX_SIMULATOR_ID=$DEVICE_ID" >> "$GITHUB_ENV"

          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b

      - name: Run Playwright e2e tests
        run: npm run e2e:web

      - name: Run Detox iOS e2e tests
        run: npm run e2e:ios

      - name: Delete iOS simulator
        if: always()
        run: |
          if [ -n "${DETOX_SIMULATOR_ID:-}" ]; then
            xcrun simctl shutdown "$DETOX_SIMULATOR_ID" || true
            xcrun simctl delete "$DETOX_SIMULATOR_ID" || true
          fi
